name: tests

# windows-latest matches the fleet's primary platform.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # pyyaml: scripts/create_project_docs.py imports yaml, and tests/test_create_project_docs.py exercises it.
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest tests -q
  skill-lint:
    # doodle-lint over this repo's skills. Strict: warnings fail the
    # build (linted clean 2026-07-14). Version pinned: a gate must not
    # change rules on PyPI's schedule — upgrade deliberately (1.0.0's
    # desc/typo flags project vocabulary).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install doodle-lint==1.0.0
      - run: doodle --strict skills
  model-neutrality:
    # Shipped content must never name a specific AI model (CLAUDE.md rule).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check for model names in shipped content
        shell: python
        run: |
          import re, pathlib, sys
          pattern = re.compile(
              r'anthropic|openai|gpt-?\d|(?<!\.)claude(?![/\\])|gemini|llama|mistral',
              re.IGNORECASE,
          )
          hits = []
          for d in ('skills', 'defaults/templates'):
              for p in pathlib.Path(d).rglob('*'):
                  if not p.is_file():
                      continue
                  for i, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                      if pattern.search(line):
                          hits.append(f'  {p}:{i}: {line.strip()}')
          if hits:
              print('Model names found in shipped content:')
              print('\n'.join(hits))
              sys.exit(1)
